[project]
name = "duplicate-files"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jean-Pierre Bouchard", email = "jeanpierre.bouchard80@gmail.com" }
]
dependencies = [
    "ttkthemes>=3.2.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
